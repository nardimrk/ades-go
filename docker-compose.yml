# Single service: WhatsApp (whatsmeow) + collector + dashboard + weekly backup.
# 1) cp .env.example .env and fill it in
# 2) docker compose up -d
# 3) open APP_URL/whatsapp and scan the QR with the phone (once)
services:
  app:
    build: .
    env_file: .env
    environment:
      DB_PATH: /app/data/wine.db
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
